name: Playwright Tests

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:
    inputs:
      test_env:
        description: Select the environment to test
        required: true
        default: local
        type: choice
        options:
          - local
          - qa
          - prod

permissions:
  contents: read

jobs:
  test:
    name: Playwright BDD Tests
    timeout-minutes: 160
    runs-on: ubuntu-latest

    env:
      CI: "true"
      TEST_ENV: ${{ inputs.test_env || 'local' }}
      BASE_URL: ${{ vars.BASE_URL }}
      LOGIN_USERNAME: ${{ secrets.LOGIN_USERNAME }}
      LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean previous test artifacts
        shell: bash
        run: |
          rm -rf \
            allure-results \
            allure-report \
            playwright-report \
            test-results \
            tests/generated \
            github-pages-report \
            beacon-report

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Set up Java for Allure
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Check required configuration
        shell: bash
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "BASE_URL repository variable is missing."
            exit 1
          fi

          if [ -z "$LOGIN_USERNAME" ]; then
            echo "LOGIN_USERNAME secret is missing."
            exit 1
          fi

          if [ -z "$LOGIN_PASSWORD" ]; then
            echo "LOGIN_PASSWORD secret is missing."
            exit 1
          fi

          echo "Required configuration is available."

      - name: Generate BDD tests
        run: npx bddgen

      - name: List discovered tests
        run: |
          npx playwright test \
            --list \
            --project=login-chromium \
            --project=login-firefox \
            --project=login-webkit \
            --project=chromium \
            --project=firefox \
            --project=webkit

      - name: Run Playwright tests on all three browsers
        id: playwright_tests
        continue-on-error: true
        run: |
          npx playwright test \
            --shuffle \
            --project=login-chromium \
            --project=login-firefox \
            --project=login-webkit \
            --project=chromium \
            --project=firefox \
            --project=webkit

      - name: Add environment details to Allure report
        if: always()
        run: npm run allure:environment

      - name: Generate Allure HTML report
        if: always()
        run: npm run allure:generate

      - name: Upload Playwright report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Perfetto timeline artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perfetto-timeline
          path: test-results/perfetto.json*
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Allure results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Allure HTML report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Beacon report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beacon-report
          path: beacon-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Prepare current run reports
        if: always()
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.playwright_tests.outcome }}
        run: |
          mkdir -p github-pages-report

          for report in allure beacon playwright; do
            case "$report" in
              allure) source="allure-report" ;;
              beacon) source="beacon-report" ;;
              playwright) source="playwright-report" ;;
            esac

            mkdir -p "github-pages-report/$report"

            if [ -f "$source/index.html" ]; then
              cp -R "$source/." "github-pages-report/$report/"
            else
              cat > "github-pages-report/$report/index.html" <<EOF
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <title>Report unavailable</title>
            </head>
            <body>
              <h1>$report report was not generated</h1>
              <p>Check the workflow logs and artifacts.</p>
            </body>
          </html>
          EOF
            fi
          done

          python3 <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          metadata = {
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_number": os.environ["GITHUB_RUN_NUMBER"],
              "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "test_outcome": os.environ.get("TEST_OUTCOME") or "unknown",
              "environment": os.environ["TEST_ENV"],
              "commit": os.environ["GITHUB_SHA"],
              "created_at": datetime.now(timezone.utc).isoformat(),
              "workflow_url": (
                  f'{os.environ["GITHUB_SERVER_URL"]}/'
                  f'{os.environ["GITHUB_REPOSITORY"]}/actions/runs/'
                  f'{os.environ["GITHUB_RUN_ID"]}'
              )
          }

          Path("github-pages-report/metadata.json").write_text(
              json.dumps(metadata, indent=2),
              encoding="utf-8"
          )
          PY

      - name: Upload current run report bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-report-bundle
          path: github-pages-report/
          retention-days: 30
          if-no-files-found: error

      - name: Fail workflow if Playwright tests failed
        if: steps.playwright_tests.outcome == 'failure'
        shell: bash
        run: |
          echo "One or more Playwright tests failed."
          exit 1

  deploy:
    name: Publish Latest Reports
    needs: test

    if: >
      always() &&
      needs.test.result != 'cancelled' &&
      github.event_name != 'pull_request' &&
      (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/master'
      )

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: github-pages-history
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download current run report bundle
        uses: actions/download-artifact@v4
        with:
          name: pages-report-bundle
          path: current-report

      - name: Prepare latest-run website
        shell: bash
        env:
          JOB_RESULT: ${{ needs.test.result }}
        run: |
          python3 <<'PY'
          import html
          import json
          import os
          import shutil
          from pathlib import Path

          site = Path("published-site")
          source = Path("current-report")

          if site.exists():
              shutil.rmtree(site)

          run_key = (
              f'{os.environ["GITHUB_RUN_ID"]}-'
              f'{os.environ["GITHUB_RUN_ATTEMPT"]}'
          )

          destination = site / "runs" / run_key
          destination.parent.mkdir(parents=True, exist_ok=True)
          shutil.copytree(source, destination)

          metadata_file = destination / "metadata.json"
          metadata = json.loads(
              metadata_file.read_text(encoding="utf-8")
          )

          metadata["job_result"] = os.environ["JOB_RESULT"]

          metadata_file.write_text(
              json.dumps(metadata, indent=2),
              encoding="utf-8"
          )

          def escape(value):
              return html.escape(str(value), quote=True)

          folder = escape(run_key)
          number = escape(metadata["run_number"])
          attempt = escape(metadata["attempt"])
          outcome = escape(metadata.get("test_outcome", "unknown"))
          job_result = escape(metadata["job_result"])
          environment = escape(metadata.get("environment", "unknown"))
          timestamp = escape(metadata.get("created_at", ""))
          commit = escape(metadata.get("commit", ""))
          workflow_url = escape(metadata["workflow_url"])

          row = (
              "<tr>"
              f"<td>#{number}, attempt {attempt}</td>"
              f"<td>{outcome}</td>"
              f"<td>{job_result}</td>"
              f"<td>{environment}</td>"
              f"<td>{timestamp}</td>"
              f'<td><a href="./runs/{folder}/allure/">Allure</a> | '
              f'<a href="./runs/{folder}/beacon/">Beacon</a> | '
              f'<a href="./runs/{folder}/playwright/">Playwright</a></td>'
              f'<td><a href="{workflow_url}">Workflow and artifacts</a></td>'
              "</tr>"
          )

          page = """<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>SuiteCRM Latest Test Reports</title>
            <style>
              body {
                font-family: sans-serif;
                padding: 2rem;
                color: #222;
              }
              table {
                border-collapse: collapse;
                width: 100%;
              }
              th, td {
                border: 1px solid #ddd;
                padding: 0.75rem;
                text-align: left;
              }
              th {
                background: #f2f2f2;
              }
              a {
                color: #2457c5;
              }
              .table-wrapper {
                overflow-x: auto;
              }
              .note {
                color: #555;
              }
              code {
                overflow-wrap: anywhere;
              }
            </style>
          </head>
          <body>
            <h1>SuiteCRM Latest Test Reports</h1>
            <p>
              Only the latest successfully published run is hosted here.
              Its tests may have passed or failed.
            </p>
            <p class="note">
              Full reports and debugging files are also uploaded to
              the workflow as artifacts with a 30-day retention setting.
              Older report pages are not retained on this site.
            </p>
            <div class="table-wrapper">
              <table>
                <thead>
                  <tr>
                    <th>Run</th>
                    <th>Playwright outcome</th>
                    <th>Test job result</th>
                    <th>Environment</th>
                    <th>Report prepared at (UTC)</th>
                    <th>Reports</th>
                    <th>Logs and artifacts</th>
                  </tr>
                </thead>
                <tbody>
          """ + row + """
                </tbody>
              </table>
            </div>
          """ + f"<p>Commit: <code>{commit}</code></p>" + """
          </body>
          </html>
          """

          (site / "index.html").write_text(
              page,
              encoding="utf-8"
          )

          (site / ".nojekyll").touch()

          print(f"Prepared website for run #{number}, attempt {attempt}.")
          PY

      - name: Check report size before publishing
        shell: bash
        run: |
          echo "Report folder sizes:"
          du -h --max-depth=3 published-site | sort -h | tail -25

          python3 <<'PY'
          from pathlib import Path

          site = Path("published-site")
          budget = 900_000_000

          total = sum(
              file.stat().st_size
              for file in site.rglob("*")
              if file.is_file()
          )

          print(f"Published report content: {total / 1_000_000:.1f} MB")
          print(f"Safety budget: {budget / 1_000_000:.0f} MB")

          if total > budget:
              raise SystemExit(
                  "The latest run alone exceeds the 900 MB safety budget. "
                  "Reduce report attachments or publish fewer report formats. "
                  "Full reports are available in the workflow artifacts."
              )
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload latest reports to GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: published-site

      - name: Deploy latest reports to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

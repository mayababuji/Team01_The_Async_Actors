name: Playwright Tests

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:
    inputs:
      test_env:
        description: Select the environment to test
        required: true
        default: local
        type: choice
        options:
          - local
          - qa
          - prod

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      CI: true
      TEST_ENV: ${{ inputs.test_env || 'local' }}
      BASE_URL: ${{ vars.BASE_URL }}
      LOGIN_USERNAME: ${{ secrets.LOGIN_USERNAME }}
      LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java for Allure
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Check required secrets
        shell: bash
        run: |
          if [ -z "$LOGIN_USERNAME" ]; then
            echo "LOGIN_USERNAME is missing"
            exit 1
          fi

          if [ -z "$LOGIN_PASSWORD" ]; then
            echo "LOGIN_PASSWORD is missing"
            exit 1
          fi

          echo "Required credentials are available"

      - name: Generate BDD tests
        run: npx bddgen

      - name: Run Playwright tests
        run: npx playwright test
        continue-on-error: true

      - name: Generate Allure HTML report
        if: always()
        run: npm run allure:generate

      - name: Upload Playwright report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Allure results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Allure HTML report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Prepare GitHub Pages Allure report
        if: always()
        shell: bash
        run: |
          mkdir -p github-pages-report

          if [ -f allure-report/index.html ]; then
            cp -R allure-report/. github-pages-report/
          else
            printf '%s\n' \
              '<!doctype html>' \
              '<html>' \
              '<head><title>Allure Report</title></head>' \
              '<body><h1>Allure report was not generated</h1></body>' \
              '</html>' \
              > github-pages-report/index.html
          fi

      - name: Upload GitHub Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          path: github-pages-report

  deploy:
    if: always()
    needs: test
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Allure report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
name: Playwright Tests

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:
    inputs:
      test_env:
        description: Select the environment to test
        required: true
        default: local
        type: choice
        options:
          - local
          - qa
          - prod

permissions:
  contents: read

jobs:
  test:
    name: Playwright BDD Tests
    timeout-minutes: 160
    runs-on: ubuntu-latest

    env:
      CI: "true"
      TEST_ENV: ${{ inputs.test_env || 'local' }}
      BASE_URL: ${{ vars.BASE_URL }}
      LOGIN_USERNAME: ${{ secrets.LOGIN_USERNAME }}
      LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean previous test artifacts
        shell: bash
        run: |
          rm -rf \
            allure-results \
            allure-report \
            playwright-report \
            test-results \
            tests/generated \
            github-pages-report \
            beacon-report

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java for Allure
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Check required configuration
        shell: bash
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "BASE_URL repository variable is missing."
            exit 1
          fi

          if [ -z "$LOGIN_USERNAME" ]; then
            echo "LOGIN_USERNAME secret is missing."
            exit 1
          fi

          if [ -z "$LOGIN_PASSWORD" ]; then
            echo "LOGIN_PASSWORD secret is missing."
            exit 1
          fi

          echo "Required configuration is available."

      - name: Generate BDD tests
        run: npx bddgen

      - name: Run Playwright tests on all three browsers
        id: playwright_tests
        continue-on-error: true
        run: |
          npx playwright test \
            --shuffle \
            --project=login-chromium \
            --project=login-firefox \
            --project=login-webkit \
            --project=chromium \
            --project=firefox \
            --project=webkit

      - name: Add environment details to Allure report
        if: always()
        run: npm run allure:environment

      - name: Generate Allure HTML report
        if: always()
        run: npm run allure:generate

      - name: Upload Playwright report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Perfetto timeline artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perfetto-timeline
          path: test-results/perfetto.json*
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Allure results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Allure HTML report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Beacon report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beacon-report
          path: beacon-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Prepare current run reports
        if: always()
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.playwright_tests.outcome }}
        run: |
          mkdir -p github-pages-report

          for report in allure beacon playwright; do
            case "$report" in
              allure) source="allure-report" ;;
              beacon) source="beacon-report" ;;
              playwright) source="playwright-report" ;;
            esac

            mkdir -p "github-pages-report/$report"

            if [ -f "$source/index.html" ]; then
              cp -R "$source/." "github-pages-report/$report/"
            else
              cat > "github-pages-report/$report/index.html" <<EOF
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <title>Report unavailable</title>
            </head>
            <body>
              <h1>$report report was not generated</h1>
              <p>Check the workflow logs and artifacts.</p>
            </body>
          </html>
          EOF
            fi
          done

          python3 <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          metadata = {
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_number": os.environ["GITHUB_RUN_NUMBER"],
              "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "test_outcome": os.environ.get("TEST_OUTCOME", "unknown"),
              "environment": os.environ["TEST_ENV"],
              "commit": os.environ["GITHUB_SHA"],
              "created_at": datetime.now(timezone.utc).isoformat(),
              "workflow_url": (
                  f'{os.environ["GITHUB_SERVER_URL"]}/'
                  f'{os.environ["GITHUB_REPOSITORY"]}/actions/runs/'
                  f'{os.environ["GITHUB_RUN_ID"]}'
              )
          }

          Path("github-pages-report/metadata.json").write_text(
              json.dumps(metadata, indent=2)
          )
          PY

      - name: Upload current run report bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-report-bundle
          path: github-pages-report/
          retention-days: 30
          if-no-files-found: error

      - name: Fail workflow if Playwright tests failed
        if: steps.playwright_tests.outcome == 'failure'
        shell: bash
        run: |
          echo "One or more Playwright tests failed."
          exit 1

  deploy:
    name: Publish Report History
    needs: test

    if: >
      always() &&
      needs.test.result != 'cancelled' &&
      github.event_name != 'pull_request' &&
      (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/master'
      )

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    concurrency:
      group: github-pages-history
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download current run report bundle
        uses: actions/download-artifact@v4
        with:
          name: pages-report-bundle
          path: current-report

      - name: Restore saved report history
        shell: bash
        run: |
          mkdir -p published-site
          git init published-site
          git -C published-site checkout -b gh-pages

          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git fetch origin gh-pages
            git archive FETCH_HEAD | tar -x -C published-site

            # Use the existing history commit as the parent.
            git -C published-site fetch \
              "$GITHUB_WORKSPACE" FETCH_HEAD

            git -C published-site reset --mixed FETCH_HEAD
          fi

      - name: Add current run and rebuild report homepage
        shell: bash
        env:
          JOB_RESULT: ${{ needs.test.result }}
        run: |
          RUN_KEY="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          mkdir -p "published-site/runs/$RUN_KEY"
          cp -R current-report/. "published-site/runs/$RUN_KEY/"
          touch published-site/.nojekyll

          python3 <<'PY'
          import html
          import json
          import os
          from pathlib import Path

          site = Path("published-site")
          key = (
              f'{os.environ["GITHUB_RUN_ID"]}-'
              f'{os.environ["GITHUB_RUN_ATTEMPT"]}'
          )

          current_metadata = site / "runs" / key / "metadata.json"
          current = json.loads(current_metadata.read_text())
          current["job_result"] = os.environ["JOB_RESULT"]
          current_metadata.write_text(json.dumps(current, indent=2))

          runs = []

          for metadata_file in (site / "runs").glob("*/metadata.json"):
              try:
                  data = json.loads(metadata_file.read_text())
                  data["folder"] = metadata_file.parent.name
                  runs.append(data)
              except (ValueError, OSError):
                  continue

          runs.sort(
              key=lambda run: (
                  int(run["run_number"]),
                  int(run["attempt"])
              ),
              reverse=True
          )

          rows = []

          for run in runs:
              folder = html.escape(run["folder"], quote=True)
              number = html.escape(str(run["run_number"]))
              attempt = html.escape(str(run["attempt"]))
              outcome = html.escape(run.get("test_outcome", "unknown"))
              job_result = html.escape(run.get("job_result", "unknown"))
              environment = html.escape(run.get("environment", "unknown"))
              timestamp = html.escape(run.get("created_at", ""))
              workflow_url = html.escape(run["workflow_url"], quote=True)

              rows.append(
                  "<tr>"
                  f"<td>#{number}, attempt {attempt}</td>"
                  f"<td>{outcome}</td>"
                  f"<td>{job_result}</td>"
                  f"<td>{environment}</td>"
                  f"<td>{timestamp}</td>"
                  f'<td><a href="./runs/{folder}/allure/">Allure</a> | '
                  f'<a href="./runs/{folder}/beacon/">Beacon</a> | '
                  f'<a href="./runs/{folder}/playwright/">Playwright</a></td>'
                  f'<td><a href="{workflow_url}">Workflow</a></td>'
                  "</tr>"
              )

          page = """<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>SuiteCRM Test Report History</title>
            <style>
              body { font-family: sans-serif; padding: 2rem; }
              table { border-collapse: collapse; width: 100%; }
              th, td {
                border: 1px solid #ddd;
                padding: 0.75rem;
                text-align: left;
              }
              th { background: #f2f2f2; }
              a { color: #2457c5; }
              .table-wrapper { overflow-x: auto; }
            </style>
          </head>
          <body>
            <h1>SuiteCRM Test Report History</h1>
            <p>Reports from passing and failing runs, newest first.</p>
            <div class="table-wrapper">
              <table>
                <thead>
                  <tr>
                    <th>Run</th>
                    <th>Playwright outcome</th>
                    <th>Test job result</th>
                    <th>Environment</th>
                    <th>Published at (UTC)</th>
                    <th>Reports</th>
                    <th>Logs</th>
                  </tr>
                </thead>
                <tbody>
          """ + "\n".join(rows) + """
                </tbody>
              </table>
            </div>
          </body>
          </html>
          """

          (site / "index.html").write_text(page)
          PY

      - name: Save report history to gh-pages branch
        shell: bash
        run: |
          git -C published-site config user.name "github-actions[bot]"
          git -C published-site config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git -C published-site add --all

          if ! git -C published-site diff --cached --quiet; then
            git -C published-site commit \
              -m "Add reports for run ${GITHUB_RUN_NUMBER}, attempt ${GITHUB_RUN_ATTEMPT}"
          fi

          # Push through the checkout repository, which has authentication.
          COMMIT=$(git -C published-site rev-parse HEAD)

          git fetch ./published-site gh-pages
          git push origin FETCH_HEAD:refs/heads/gh-pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload complete report history
        uses: actions/upload-pages-artifact@v4
        with:
          path: published-site

      - name: Deploy report history to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
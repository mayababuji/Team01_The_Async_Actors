name: Playwright Tests

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:
    inputs:
      test_env:
        description: Select the environment to test
        required: true
        default: local
        type: choice
        options:
          - local
          - qa
          - prod

permissions:
  contents: read

jobs:
  test:
    name: Playwright BDD Tests
    timeout-minutes: 160
    runs-on: ubuntu-latest

    env:
      CI: "true"
      TEST_ENV: ${{ inputs.test_env || 'local' }}
      BASE_URL: ${{ vars.BASE_URL }}
      LOGIN_USERNAME: ${{ secrets.LOGIN_USERNAME }}
      LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean previous test artifacts
        shell: bash
        run: |
          rm -rf \
            allure-results \
            allure-report \
            playwright-report \
            test-results \
            tests/generated \
            github-pages-report \
            beacon-report

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Set up Java for Allure
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Check required configuration
        shell: bash
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "BASE_URL repository variable is missing."
            exit 1
          fi

          if [ -z "$LOGIN_USERNAME" ]; then
            echo "LOGIN_USERNAME secret is missing."
            exit 1
          fi

          if [ -z "$LOGIN_PASSWORD" ]; then
            echo "LOGIN_PASSWORD secret is missing."
            exit 1
          fi

          echo "Required configuration is available."

      - name: Generate BDD tests
        run: npx bddgen

      - name: List discovered tests
        run: |
          npx playwright test \
            --list \
            --project=login-chromium \
            --project=login-firefox \
            --project=login-webkit \
            --project=chromium \
            --project=firefox \
            --project=webkit

      - name: Run Playwright tests on all three browsers
        id: playwright_tests
        continue-on-error: true
        run: |
          npx playwright test \
            --shuffle \
            --project=login-chromium \
            --project=login-firefox \
            --project=login-webkit \
            --project=chromium \
            --project=firefox \
            --project=webkit

      - name: Add environment details to Allure report
        if: always()
        run: npm run allure:environment

      - name: Generate Allure HTML report
        if: always()
        run: npm run allure:generate

      - name: Upload Playwright report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Perfetto timeline artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perfetto-timeline
          path: test-results/perfetto.json*
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Allure results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Allure HTML report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Beacon report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beacon-report
          path: beacon-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Add test outcome and artifact information to summary
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.playwright_tests.outcome }}
        shell: bash
        run: |
          {
            echo "## Playwright BDD Tests"
            echo ""
            echo "- Run: #${GITHUB_RUN_NUMBER}"
            echo "- Attempt: ${GITHUB_RUN_ATTEMPT}"
            echo "- Environment: ${TEST_ENV}"
            echo "- Playwright outcome: ${TEST_OUTCOME:-unknown}"
            echo ""
            echo "### Downloadable reports"
            echo ""
            echo "Available reports are in this run's Artifacts section:"
            echo ""
            echo "- allure-report"
            echo "- beacon-report"
            echo "- playwright-report"
            echo "- allure-results"
            echo "- test-results"
            echo "- perfetto-timeline"
            echo ""
            echo "Artifacts are uploaded with a 30-day retention setting."
            echo ""
            echo "For main/master runs, the Publish Allure Report job"
            echo "adds an online Allure link after successful deployment."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail workflow if Playwright tests failed
        if: steps.playwright_tests.outcome == 'failure'
        shell: bash
        run: |
          echo "One or more Playwright tests failed."
          exit 1

  deploy:
    name: Publish Allure Report
    needs: test

    if: >
      always() &&
      needs.test.result != 'cancelled' &&
      github.event_name != 'pull_request' &&
      (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/master'
      )

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: github-pages-history
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download Allure HTML report
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: published-site

      - name: Validate Allure report and check size
        shell: bash
        run: |
          if [ ! -f published-site/index.html ]; then
            echo "::error::Allure index.html was not found."
            exit 1
          fi

          touch published-site/.nojekyll

          echo "Allure report folder sizes:"
          du -h --max-depth=2 published-site | sort -h | tail -20

          python3 <<'PY'
          from pathlib import Path

          site = Path("published-site")
          budget = 900_000_000

          total = sum(
              file.stat().st_size
              for file in site.rglob("*")
              if file.is_file()
          )

          print(f"Extracted Allure report: {total / 1_000_000:.1f} MB")
          print(f"Safety budget: {budget / 1_000_000:.0f} MB")

          if total > budget:
              raise SystemExit(
                  "The Allure report exceeds the 900 MB safety budget. "
                  "Reduce generated attachments before publishing. "
                  "The full report remains available as a workflow artifact."
              )
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Allure website
        uses: actions/upload-pages-artifact@v4
        with:
          path: published-site

      - name: Deploy Allure report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show online Allure link in Actions summary
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          {
            echo "## Online Allure report"
            echo ""
            echo "Published from run #${GITHUB_RUN_NUMBER}, attempt ${GITHUB_RUN_ATTEMPT}."
            echo ""
            echo "[Open the Allure report](${PAGE_URL})"
            echo ""
            echo "This URL always displays the latest successfully published report."
            echo "A later successful deployment replaces the report at this URL."
            echo ""
            echo "### Beacon and Playwright"
            echo ""
            echo "Download these from this workflow run's Artifacts section:"
            echo ""
            echo "- beacon-report"
            echo "- playwright-report"
            echo ""
            echo "The complete Allure HTML report is also available as allure-report."
          } >> "$GITHUB_STEP_SUMMARY"